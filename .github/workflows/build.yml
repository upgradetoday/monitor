name: Build and publish

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep the Wordfence data between runs, so the full feed is
      # downloaded at most every 6 hours instead of every hour
      - uses: actions/cache@v4
        with:
          path: .wordpress_core_vulns.json
          key: wordfence-${{ github.run_id }}
          restore-keys: wordfence-

      - name: Build page
        run: python3 upgradetoday.py --build site/index.html
        env:
          WORDFENCE_API_KEY: ${{ secrets.WORDFENCE_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
